name: ECS image publication (manual, OIDC)

# Hardened image-publication pipeline. See docs/ecs/container-architecture.md
# and docs/security/ecs-image-vulnerability-exceptions.md for the full
# narrative. This workflow's ENTIRE scope, deliberately:
#
#   1. Validate the exact requested commit (full 40-char SHA required).
#   2. Lint and test that exact commit.
#   3. Build ONE linux/amd64 image from it (no provenance/SBOM attestation
#      manifests — a single-platform image, not an OCI index).
#   4. Scan it (vulnerabilities + secrets) before it is ever pushed.
#   5. Smoke-test all six container roles against disposable local
#      Postgres/Redis service containers.
#   6. Confirm the immutable tag does not already exist, then publish.
#   7. Verify the pushed digest and ECR scan status.
#   8. Stop.
#
# This workflow does NOT, anywhere, in any job:
#   - register an ECS task definition
#   - update an ECS service
#   - run a database migration against a real environment
#   - modify the ALB
#   - retrieve any application secret value
#
# Deployment is a SEPARATE, not-yet-implemented, approval-gated phase — the
# `deploy-staging` job below exists only as a structural placeholder for
# that future work and is gated on a repository variable
# (`vars.ENABLE_STAGING_DEPLOY == 'true'`) that does not exist yet, so it is
# unreachable until it is actually built out. It intentionally uses a
# DIFFERENT IAM role
# (`AWS_DEPLOY_ROLE_ARN`) than image publication (`AWS_ECR_PUBLISH_ROLE_ARN`)
# so the publishing identity can never itself deploy.
#
# Required repository configuration (none of this is created by this
# change — see docs/security/ecs-image-vulnerability-exceptions.md):
#   - AWS_ECR_PUBLISH_ROLE_ARN (repo variable) — OIDC-federated IAM role,
#     scoped ONLY to ECR push/describe on the `firmsbase-staging`
#     repository. Trust policy subject must be exactly:
#       repo:Aramitusconnect/firmsbase:ref:refs/heads/feature/ecs-staging-validation
#   - AWS_REGION (repo variable) — must equal `us-east-1`; this workflow
#     fails the run otherwise rather than silently using a different region.
#   - ECR_REPOSITORY_URL (repo variable) — full URI, e.g.
#     603013471426.dkr.ecr.us-east-1.amazonaws.com/firmsbase-staging
#   - AWS_DEPLOY_ROLE_ARN — NOT required for this workflow to run (only
#     referenced by the disabled deploy-staging stub). Its OIDC trust
#     subject, when that job is eventually built out, must be exactly:
#       repo:Aramitusconnect/firmsbase:environment:staging
#   - ECS_CLUSTER_NAME / STAGING_URL are NOT required by this workflow at
#     all — those only matter once deploy-staging is implemented for real.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA to build and publish (not a branch, tag, or short SHA)."
        required: true
        type: string
      base_sha:
        description: "Optional: full 40-character commit SHA to use as the lint diff baseline (must be an ancestor of commit_sha) instead of origin/main. Use this for a long-lived feature lineage where origin/main has fallen far behind and diffing against it would falsely treat months of already-reviewed work as new. Leave blank for the default origin/main baseline."
        required: false
        type: string

env:
  PHP_VERSION: "8.3"

jobs:
  # ---------------------------------------------------------------------
  # Gate 0: the requested commit must be an exact, real, full-length SHA.
  # Every later job re-checks out this exact commit independently (each
  # runs on its own fresh runner) rather than trusting this job's checkout
  # to persist.
  # ---------------------------------------------------------------------
  validate-commit:
    name: Validate requested commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.shortsha.outputs.short_sha }}
      lint_base_sha: ${{ steps.lintbase.outputs.lint_base_sha }}
    steps:
      - name: Reject anything that is not a full 40-character hex commit SHA
        run: |
          set -euo pipefail
          SHA="${{ inputs.commit_sha }}"
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::commit_sha must be exactly 40 hex characters (a full commit SHA, not a branch, tag, or abbreviated SHA). Got: '$SHA'"
            exit 1
          fi
          echo "Format OK: $SHA"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          fetch-depth: 0

      - name: Confirm the commit actually exists in this repository
        run: |
          set -euo pipefail
          SHA="${{ inputs.commit_sha }}"
          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "::error::commit $SHA does not exist in this repository"
            exit 1
          fi
          echo "Confirmed: $SHA exists as a commit object."

      - name: Checkout the exact requested commit and verify HEAD matches
        run: |
          set -euo pipefail
          SHA="${{ inputs.commit_sha }}"
          git checkout --quiet "$SHA"
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "$SHA" ]; then
            echo "::error::HEAD ($ACTUAL) does not exactly equal the requested commit_sha ($SHA) after checkout"
            exit 1
          fi
          echo "Confirmed: HEAD exactly equals requested commit $SHA"

      - name: Compute the 7-character short SHA used as the ECR tag
        id: shortsha
        run: |
          SHA="${{ inputs.commit_sha }}"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Fails closed: an invalid or unrelated base_sha must abort the run
      # rather than silently falling back to origin/main (which would
      # defeat the entire point of supplying one). Blank input is the
      # only case that legitimately falls back — every non-blank value
      # must prove itself.
      - name: Validate optional base_sha (lint diff baseline)
        id: lintbase
        run: |
          set -euo pipefail
          BASE_SHA="${{ inputs.base_sha }}"
          SHA="${{ inputs.commit_sha }}"

          if [[ -z "$BASE_SHA" ]]; then
            echo "No base_sha supplied — lint job will fall back to its own origin/main merge-base."
            echo "lint_base_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::base_sha must be exactly 40 hex characters (a full commit SHA, not a branch, tag, or abbreviated SHA). Got: '$BASE_SHA'"
            exit 1
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::base_sha '$BASE_SHA' does not exist as a commit object in this repository"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$BASE_SHA" "$SHA"; then
            echo "::error::base_sha '$BASE_SHA' is not an ancestor of commit_sha '$SHA' — refusing to use an unrelated commit as the lint diff baseline."
            exit 1
          fi

          echo "Confirmed: base_sha '$BASE_SHA' is a valid ancestor of commit_sha '$SHA'."
          echo "lint_base_sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  lint:
    name: Lint requested commit
    needs: validate-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          ref: ${{ inputs.commit_sha }}
          # Full history is required to compute a merge-base with
          # origin/main below — a shallow (default depth-1) checkout would
          # make `git merge-base` fail outright.
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2026-06 release)
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - name: Composer validate
        run: composer validate --strict

      - name: Install dependencies (with dev, for lint tooling)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check (every changed and existing PHP file)
        run: find app config database routes tests bootstrap -name "*.php" -print0 | xargs -0 -n1 php -l

      # Laravel Pint runs ONLY against PHP files this commit actually
      # changed relative to a baseline — the full repository carries
      # substantial pre-existing style debt (hundreds of files) that
      # predates this branch and is not this branch's responsibility to
      # fix — running `pint --test` unscoped would block every
      # publication run on that pre-existing debt instead of on anything
      # this commit is actually responsible for.
      #
      # Default baseline is origin/main's own merge-base with HEAD. For a
      # long-lived feature lineage where origin/main has fallen months
      # behind (this repo's actual situation as of the staging-safety
      # QA release — see the failed run this fixes), diffing against
      # origin/main collects that ENTIRE lineage's accumulated debt in
      # one shot, not just this release's own change. Pass base_sha
      # (validated and required to be a real ancestor of commit_sha in
      # the validate-commit job — an invalid/unrelated value fails the
      # run closed, never silently falls back) to scope correctly
      # instead.
      - name: Determine PHP files changed relative to the lint baseline
        id: changed-php
        run: |
          set -euo pipefail
          LINT_BASE_SHA="${{ needs.validate-commit.outputs.lint_base_sha }}"

          if [[ -n "$LINT_BASE_SHA" ]]; then
            BASE_SHA="$LINT_BASE_SHA"
            echo "Using explicit lint baseline (base_sha input): ${BASE_SHA}"
          else
            git fetch origin main --quiet
            BASE_SHA="$(git merge-base HEAD origin/main)"
            echo "No base_sha supplied — using origin/main merge-base: ${BASE_SHA}"
          fi

          # -z / --null-terminated output avoids any word-splitting or
          # newline-in-filename hazard; --diff-filter=ACMR (Added, Copied,
          # Modified, Renamed) deliberately excludes Deleted files — Pint
          # cannot and should not check a file that no longer exists.
          mapfile -d '' -t CHANGED_PHP < <(git diff --diff-filter=ACMR -z --name-only "${BASE_SHA}...HEAD" -- '*.php')

          if [[ "${#CHANGED_PHP[@]}" -eq 0 ]]; then
            echo "No PHP files changed relative to origin/main — nothing for Pint to check."
            echo "has_php=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_php=true" >> "$GITHUB_OUTPUT"
          echo "Checking ${#CHANGED_PHP[@]} changed PHP file(s):"
          printf '  %s\n' "${CHANGED_PHP[@]}"

          # NUL-delimited write/read round-trip (not newline-joined) keeps
          # this safe even if a path ever contained a space.
          printf '%s\0' "${CHANGED_PHP[@]}" > /tmp/changed-php-files.list

      - name: Laravel Pint (changed PHP files only — see composer.json require-dev)
        if: steps.changed-php.outputs.has_php == 'true'
        run: |
          set -euo pipefail
          mapfile -d '' -t CHANGED_PHP < /tmp/changed-php-files.list
          vendor/bin/pint --test "${CHANGED_PHP[@]}"

      - name: Shell script syntax check
        run: find docker -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ---------------------------------------------------------------------
  test:
    name: Run tests (disposable CI database)
    needs: validate-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      # Disposable, CI-only Laravel encryption key — NOT a production or
      # staging secret. Generated once for this workflow
      # (`base64:$(openssl rand -base64 32)`, AES-256-CBC-compatible: 32
      # raw bytes) and committed here deliberately, because it protects
      # nothing sensitive: every database, row, and ciphertext it ever
      # touches is destroyed at the end of the same job run (see "Destroy
      # disposable test database" below). It is never used to encrypt
      # anything outside this CI job, never written to a file, and never
      # printed. Required because EncryptionKeyService::provision()
      # (app/Services/EncryptionKeyService.php) calls Crypt::encryptString()
      # — Laravel throws MissingAppKeyException the first time any test
      # touches per-firm key provisioning if APP_KEY is unset.
      APP_KEY: "base64:ELVhdkVn+QSCzkyvW6Io8hKv/lmwnzz6LLmlYIhiL6o="
      # config/database.php's own redis connections default to these
      # exact values (env('REDIS_HOST', '127.0.0.1') / env('REDIS_PORT',
      # '6379')) — set explicitly here anyway so the job's requirement is
      # visible without having to cross-reference application config.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis 7, matching staging's real ElastiCache engine_version (see
      # infrastructure/ecs/environments/staging/terraform.tfvars.example,
      # elasticache_engine_version = "7.2"). A handful of tests
      # (e.g. DashboardRedisCacheSerializationTest) deliberately force
      # cache.default/session.driver to 'redis' — phpunit.xml otherwise
      # defaults both to the 'array' driver — because that exact class of
      # bug (RedisStore's unserialize() behavior) is invisible under any
      # non-Redis driver. Previously this job installed the redis PHP
      # extension but never provisioned a server for it to connect to.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          ref: ${{ inputs.commit_sha }}

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 (2026-06 release)
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, redis, bcmath, gd, intl, zip, opcache, pcntl, posix, sockets, soap, sodium, exif, igbinary

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # See the equivalent step's history for the tools/rls-test/ portability
      # note (RLS_LOCK_FILE hardcodes a sandbox-specific path) — unchanged
      # by this hardening pass, flagged not silently worked around here.
      #
      # tools/rls-test/lib.sh's rls_admin_psql() only has a Unix-socket
      # (peer-auth, `sudo -u postgres psql`) code path unless PGHOST is set —
      # this GitHub Actions Postgres *service container* has no local
      # `postgres` OS user and no socket at all, only TCP. Exporting the
      # standard libpq PGHOST/PGPORT/PGUSER/PGPASSWORD vars here switches
      # rls_admin_psql (and the raw `psql` call below) onto a direct TCP
      # connection using the same admin credentials already configured on
      # the `postgres` service above.
      - name: Provision disposable test database via tools/rls-test/
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          sudo mkdir -p /home/ubuntu/firmsbase/rls-checkpoints
          sudo chown "$(id -u):$(id -g)" /home/ubuntu/firmsbase/rls-checkpoints

          echo "Waiting for PostgreSQL to accept TCP connections on ${PGHOST}:${PGPORT}..."
          for attempt in $(seq 1 30); do
            if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" >/dev/null 2>&1; then
              echo "PostgreSQL is ready (attempt ${attempt})."
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "::error::PostgreSQL did not become ready on ${PGHOST}:${PGPORT} after 30 attempts"
              exit 1
            fi
            sleep 2
          done

          RUN_PASSWORD="$(openssl rand -hex 24)"
          psql -c "CREATE ROLE rls_test_runner_39a3l LOGIN PASSWORD '${RUN_PASSWORD}';"
          mkdir -p .rls-test-secrets
          # tools/rls-test/lib.sh's rls_test_role_password() reads this file
          # verbatim as the password (a plain `cat`, not pgpass-field
          # parsing) — it must contain ONLY the password, nothing else.
          printf '%s' "${RUN_PASSWORD}" > .rls-test-secrets/rls_test_runner_39a3l.pgpass
          chmod 600 .rls-test-secrets/rls_test_runner_39a3l.pgpass
          DB_NAME="$(tools/rls-test/create-disposable-db.sh ci)"
          echo "DB_NAME=${DB_NAME}" >> "$GITHUB_ENV"

      # Fast fail-closed check before paying for the full suite: confirms
      # APP_KEY is actually present, Laravel boots, the encrypter can
      # round-trip a value (exactly what EncryptionKeyService needs), and
      # the disposable database connection this job just provisioned is
      # reachable — all via the same run-artisan-test.sh wrapper (and
      # therefore the same sentinel/naming/blocklist guards) the real test
      # run uses, so this isn't a second, divergent code path. Never prints
      # APP_KEY or any derived ciphertext.
      #
      # This step calls run-artisan-test.sh, which checks the mission
      # sentinel (rls_verify_sentinel, via rls_admin_psql) before running
      # anything else — exactly like "Run test suite" below, it needs the
      # same admin TCP connection vars, or rls_admin_psql falls back to a
      # Unix-socket/peer-auth attempt that cannot work in this service
      # container (this step previously omitted this block entirely,
      # which is precisely what caused the observed
      # `/var/run/postgresql/.s.PGSQL.5432` / `role "root" does not
      # exist` failure).
      - name: Preflight — APP_KEY, Laravel boot, encryption round-trip, DB connectivity
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          if [[ -z "${APP_KEY:-}" ]]; then
            echo "::error::APP_KEY is not set for the preflight check"
            exit 1
          fi
          tools/rls-test/run-artisan-test.sh "${DB_NAME}" -- tinker --execute="
            if (! config('app.key')) {
                fwrite(STDERR, 'PREFLIGHT FAILED: config(\'app.key\') is empty despite APP_KEY being set in the environment'.PHP_EOL);
                exit(1);
            }
            \$plain = 'preflight-roundtrip-'.bin2hex(random_bytes(8));
            \$encrypted = \Illuminate\Support\Facades\Crypt::encryptString(\$plain);
            \$decrypted = \Illuminate\Support\Facades\Crypt::decryptString(\$encrypted);
            if (\$decrypted !== \$plain) {
                fwrite(STDERR, 'PREFLIGHT FAILED: encrypter round-trip mismatch'.PHP_EOL);
                exit(1);
            }
            \Illuminate\Support\Facades\DB::select('SELECT 1');
            echo 'PREFLIGHT OK: APP_KEY present, Laravel booted, encrypter round-trip verified, disposable DB connection verified'.PHP_EOL;
          "

      # run-artisan-test.sh checks the mission sentinel (rls_verify_sentinel,
      # via rls_admin_psql) BEFORE running php artisan — it needs the same
      # admin TCP connection vars as the provisioning/destroy steps, or
      # rls_admin_psql falls back to the peer-auth `sudo -u postgres psql`
      # path, which fails in this service container. That failure was
      # previously masked as a misleading "no mission sentinel comment"
      # error (see lib.sh's rls_verify_sentinel — now fixed to surface a
      # real connectivity failure distinctly instead of swallowing it).
      - name: Run test suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: tools/rls-test/run-artisan-test.sh "${DB_NAME}" -- test

      - name: Destroy disposable test database
        if: always()
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: postgres
          PGPASSWORD: postgres
        run: tools/rls-test/destroy-disposable-db.sh "${DB_NAME}" || true

  # ---------------------------------------------------------------------
  # Gate 1-7: build exactly the requested commit, scan it, smoke-test all
  # six roles, confirm the tag is free, publish, verify. Uses ONLY the
  # ECR-publish identity — never AWS_DEPLOY_ROLE_ARN.
  # ---------------------------------------------------------------------
  build-scan-and-publish:
    name: Build, scan, smoke-test, and publish image
    needs: [validate-commit, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — no static AWS credentials anywhere in this job
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: firmsbase
          POSTGRES_PASSWORD: smokepass
          POSTGRES_DB: firmsbase_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.0
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Re-confirm HEAD equals the requested commit in this job too
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if [ "$ACTUAL" != "${{ inputs.commit_sha }}" ]; then
            echo "::error::HEAD ($ACTUAL) does not equal requested commit_sha (${{ inputs.commit_sha }}) in build-scan-and-publish"
            exit 1
          fi

      - name: Require AWS_REGION to be exactly us-east-1
        run: |
          set -euo pipefail
          if [ "${{ vars.AWS_REGION }}" != "us-east-1" ]; then
            echo "::error::AWS_REGION repository variable must be exactly 'us-east-1', got '${{ vars.AWS_REGION }}'"
            exit 1
          fi

      - name: Require ECR_REPOSITORY_URL to point at firmsbase-staging
        run: |
          set -euo pipefail
          if [[ "${{ vars.ECR_REPOSITORY_URL }}" != *"/firmsbase-staging" ]]; then
            echo "::error::ECR_REPOSITORY_URL must end in /firmsbase-staging, got '${{ vars.ECR_REPOSITORY_URL }}'"
            exit 1
          fi

      - name: Compute BUILD_DATE (UTC RFC3339)
        id: builddate
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (ECR publish role only — never AWS_DEPLOY_ROLE_ARN)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.0.1

      - name: Confirm the immutable tag does not already exist — refuse to overwrite
        run: |
          set -euo pipefail
          REPO_NAME="$(basename "${{ vars.ECR_REPOSITORY_URL }}")"
          TAG="${{ needs.validate-commit.outputs.short_sha }}"
          if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists in ECR repository $REPO_NAME. Immutable tags are never overwritten — refusing to publish."
            exit 1
          fi
          echo "Confirmed: tag $TAG does not yet exist in $REPO_NAME. Safe to publish."

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1

      - name: Build image (linux/amd64 only, no provenance/SBOM attestation — not pushed yet)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ needs.validate-commit.outputs.short_sha }}
          build-args: |
            GIT_SHA=${{ inputs.commit_sha }}
            BUILD_DATE=${{ steps.builddate.outputs.value }}

      # aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
      # (v0.28.0) is a composite action whose OWN action.yaml does
      # `uses: aquasecurity/setup-trivy@v0.2.1` internally — a tag that no
      # longer resolves on GitHub ("Unable to resolve action
      # aquasecurity/setup-trivy@v0.2.1, unable to find version v0.2.1"),
      # which failed this job during "Set up job" before any Docker build,
      # scan, AWS auth, or ECR push ever ran. Rather than depend on a
      # third-party action's own internal, unpinnable-by-us dependency,
      # install Trivy directly via setup-trivy (pinned to its own current,
      # verified release) and invoke the `trivy` CLI ourselves with the
      # exact same flags trivy-action would have passed through
      # (TRIVY_SCANNERS/TRIVY_SEVERITY/TRIVY_EXIT_CODE/TRIVY_FORMAT/
      # TRIVY_OUTPUT env vars in trivy-action's entrypoint.sh correspond
      # exactly to --scanners/--severity/--exit-code/--format/--output
      # below) — same behavior, same thresholds, no dependency on
      # trivy-action's own composite-action internals at all.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.71.0
          cache: true

      # This job only ever runs against firmsbase-staging (enforced above by
      # "Require ECR_REPOSITORY_URL to point at firmsbase-staging" — there is
      # no production path in this workflow; deploy-staging below is a
      # disabled stub). --exit-code 0 here is intentional and narrowly
      # scoped to staging: the raw, complete, UNSUPPRESSED CRITICAL/HIGH
      # scan still runs in full (no .trivyignore, no --ignorefile, no
      # severity change) and its JSON is what the very next step —
      # verify-staging-exception.php — evaluates. That script is the actual
      # enforcement gate: it fails the job on ANY CRITICAL/HIGH finding
      # that is not one of the 4 exact, dated, staging-only exceptions in
      # docs/security/ecs-image-vulnerability-exceptions.md "Review:
      # 2026-08-14". A production release process must invoke `trivy image`
      # with --exit-code 1 directly (as this step did before this change)
      # and must NOT consult that exception list.
      - name: Scan image for vulnerabilities (Trivy) — raw scan, policy-gated below
        run: |
          set -euo pipefail
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format json \
            --output trivy-vuln-results.json \
            "${{ vars.ECR_REPOSITORY_URL }}:${{ needs.validate-commit.outputs.short_sha }}"

      # This job has no PHP toolchain of its own (only lint/test do) — reuse
      # the PHP 8.3 runtime already inside the image this job just built,
      # same pattern as the "runtime probe: curl reports libssh2" step below
      # (--entrypoint override, since the distroless image has no shell).
      - name: Enforce staging-only vulnerability exception policy
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace:ro" \
            --entrypoint /usr/local/bin/php \
            "${{ vars.ECR_REPOSITORY_URL }}:${{ needs.validate-commit.outputs.short_sha }}" \
            /workspace/docker/security/verify-staging-exception.php /workspace/trivy-vuln-results.json

      - name: Scan image for secrets (Trivy) — 0 findings required
        run: |
          set -euo pipefail
          trivy image \
            --scanners secret \
            --exit-code 1 \
            --format json \
            --output trivy-secret-results.json \
            "${{ vars.ECR_REPOSITORY_URL }}:${{ needs.validate-commit.outputs.short_sha }}"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-and-secret-scan
          path: |
            trivy-vuln-results.json
            trivy-secret-results.json

      # ---------------------------------------------------------------
      # Smoke test all six roles + every hardening property, against the
      # locally-built image (not yet pushed), before it is ever published.
      # Mirrors exactly what was verified interactively during the
      # container-hardening pass — see docs/security/
      # ecs-image-vulnerability-exceptions.md for the manual equivalent.
      # ---------------------------------------------------------------
      - name: Smoke-test all six roles and hardening properties
        run: |
          set -euo pipefail
          IMG="${{ vars.ECR_REPOSITORY_URL }}:${{ needs.validate-commit.outputs.short_sha }}"
          APP_KEY="base64:$(openssl rand -base64 32)"
          # PLATFORM_NOTIFICATIONS_RECIPIENT_FINGERPRINT_HMAC_KEY: required by
          # docker/entrypoint.sh for the web role (and ses-consumer, not
          # smoke-tested here) since CorrelatedPasswordResetSenderService's
          # platform-scope path was wired in — a disposable value is fine
          # here, this container and its state are destroyed at the end of
          # this same job. Discovered missing from this smoke test during
          # the 2026-08-14 staging security-remediation pass (the web role
          # smoke test would otherwise fail immediately with "missing
          # required environment variable(s)" before ever reaching /up).
          # The six canonical URL vars mirror what every real staging task
          # definition (worker/critical-worker/scheduler/web) has set since
          # the 2026-08-14 staging security-remediation pass — without them
          # here, this smoke test would keep exercising config/hosts.php's
          # local-only *.firmsvault.test fallback instead of the actual
          # strict-TrustHosts configuration staging runs under, which is
          # exactly the mismatch that let the ALB health-check Host-header
          # incompatibility (see docker/web/Caddyfile's @alb_health matcher)
          # go undetected until a real ECS deployment hit it.
          COMMON_ENV=(-e APP_KEY="$APP_KEY" -e APP_ENV=production -e DB_CONNECTION=pgsql \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_DATABASE=firmsbase_smoke \
            -e DB_USERNAME=firmsbase -e DB_PASSWORD=smokepass -e REDIS_HOST=127.0.0.1 \
            -e PLATFORM_NOTIFICATIONS_RECIPIENT_FINGERPRINT_HMAC_KEY="$(openssl rand -hex 32)" \
            -e MARKETING_URL="https://staging.firmsvault.com" \
            -e FIRM_APP_URL="https://app.staging.firmsvault.com" \
            -e CLIENT_PORTAL_URL="https://client.staging.firmsvault.com" \
            -e ADMIN_URL="https://admin.staging.firmsvault.com" \
            -e MYATTORNEY_URL="https://myattorney.staging.firmsvault.com" \
            -e API_URL="https://api.staging.firmsvault.com")

          # Prints container state + logs before a long-running-role
          # assertion fails, so a future failure shows the real exception
          # and exit code instead of only the generic "did not stay
          # running" message. Deliberately prints ONLY .State.* fields
          # (never .Config.Env, which would include APP_KEY/DB_PASSWORD)
          # plus container logs — never the container's environment.
          dump_role_diagnostics() {
            local name="$1"
            echo "--- diagnostics: $name ---"
            docker inspect "$name" --format '
          status={{.State.Status}}
          running={{.State.Running}}
          exit_code={{.State.ExitCode}}
          error={{.State.Error}}
          started={{.State.StartedAt}}
          finished={{.State.FinishedAt}}
          ' 2>&1 || true
            echo "--- logs: $name (last 200 lines) ---"
            docker logs --tail 200 "$name" 2>&1 || true
          }

          echo "=== migrate ==="
          docker run --rm --network host "${COMMON_ENV[@]}" "$IMG" migrate

          echo "=== web ==="
          docker run -d --name smoke-web --network host "${COMMON_ENV[@]}" "$IMG" web
          sleep 5
          # -H forces a trusted canonical Host header while still connecting
          # to the loopback address the container actually listens on.
          UP_CODE=$(curl -sS -H "Host: staging.firmsvault.com" -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/up)
          READY_CODE=$(curl -sS -H "Host: staging.firmsvault.com" -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/readyz)
          [ "$UP_CODE" = "200" ] || { echo "::error::/up returned $UP_CODE, expected 200"; exit 1; }
          [ "$READY_CODE" = "200" ] || { echo "::error::/readyz returned $READY_CODE, expected 200"; exit 1; }
          echo "/up=$UP_CODE /readyz=$READY_CODE"

          # All six canonical staging hosts must resolve /up successfully —
          # confirms docker/web/Caddyfile's @alb_health matcher didn't
          # accidentally interfere with normal canonical-host traffic.
          for HOST in staging.firmsvault.com app.staging.firmsvault.com client.staging.firmsvault.com \
                      admin.staging.firmsvault.com myattorney.staging.firmsvault.com api.staging.firmsvault.com; do
            CODE=$(curl -sS -H "Host: $HOST" -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/up)
            [ "$CODE" = "200" ] || { echo "::error::/up via Host=$HOST returned $CODE, expected 200"; exit 1; }
          done
          echo "OK: all six canonical hosts return 200 on /up"

          # Regression proof for the 2026-08-14 ALB health-check
          # compatibility fix (docker/web/Caddyfile's @alb_health matcher)
          # — simulates the exact request shape a real ALB target-group
          # health check sends (private-IP Host + ELB-HealthChecker/2.0
          # User-Agent), which staging hit for real during the first
          # web:14 deployment attempt (3 consecutive task failures, all
          # 400, before this fix). See
          # tests/Feature/Security/Docker/AlbHealthCheckHostCompatibilityTest.php
          # for the static Caddyfile-structure counterpart of this proof.
          FAKE_IP="172.31.86.44:8080"
          ALB_UA="ELB-HealthChecker/2.0"

          # A: exact ALB request to /up must now succeed.
          ALB_UP_CODE=$(curl -sS -H "Host: $FAKE_IP" -H "User-Agent: $ALB_UA" -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/up)
          [ "$ALB_UP_CODE" = "200" ] || { echo "::error::simulated ALB health check on /up returned $ALB_UP_CODE, expected 200"; exit 1; }

          # B: same private-IP Host with a normal (non-ALB) User-Agent must
          # still be rejected — proves the fix is not a blanket Host bypass.
          SPOOFED_UA_CODE=$(curl -sS -H "Host: $FAKE_IP" -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/up)
          [ "$SPOOFED_UA_CODE" = "400" ] || { echo "::error::private-IP Host with non-ALB User-Agent on /up returned $SPOOFED_UA_CODE, expected 400"; exit 1; }

          # C/D: spoofing the ALB User-Agent on ANY other route must not
          # bypass TrustHosts — the matcher requires an exact path match too.
          SPOOFED_ROOT_CODE=$(curl -sS -H "Host: $FAKE_IP" -H "User-Agent: $ALB_UA" -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/)
          [ "$SPOOFED_ROOT_CODE" = "400" ] || { echo "::error::spoofed ALB User-Agent on / returned $SPOOFED_ROOT_CODE, expected 400"; exit 1; }
          SPOOFED_LOGIN_CODE=$(curl -sS -H "Host: $FAKE_IP" -H "User-Agent: $ALB_UA" -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/login)
          [ "$SPOOFED_LOGIN_CODE" = "400" ] || { echo "::error::spoofed ALB User-Agent on /login returned $SPOOFED_LOGIN_CODE, expected 400"; exit 1; }

          echo "OK: simulated-ALB /up=$ALB_UP_CODE, spoofed-UA /up=$SPOOFED_UA_CODE, spoofed-UA /=$SPOOFED_ROOT_CODE, spoofed-UA /login=$SPOOFED_LOGIN_CODE"

          UID_GID=$(docker exec smoke-web /usr/local/bin/php -r "echo posix_getuid(),' ',posix_getgid();")
          [ "$UID_GID" = "1000 1000" ] || { echo "::error::expected uid/gid 1000 1000, got $UID_GID"; exit 1; }
          echo "uid/gid confirmed: $UID_GID"

          echo "=== default worker ==="
          docker run -d --name smoke-worker --network host "${COMMON_ENV[@]}" "$IMG" worker

          echo "=== trust worker (must scope to --queue=trust only) ==="
          docker run -d --name smoke-trust --network host "${COMMON_ENV[@]}" -e WORKER_QUEUES=trust "$IMG" worker
          sleep 3
          if ! docker top smoke-trust | grep -q -- '--queue=trust'; then
            echo "::error::trust worker did not scope to --queue=trust"
            dump_role_diagnostics smoke-trust
            exit 1
          fi

          echo "=== scheduler ==="
          docker run -d --name smoke-sched --network host "${COMMON_ENV[@]}" "$IMG" scheduler
          sleep 3
          if ! docker ps --filter name=smoke-sched --format '{{.Status}}' | grep -q "Up"; then
            echo "::error::scheduler did not stay running"
            dump_role_diagnostics smoke-sched
            exit 1
          fi

          echo "=== maintenance ==="
          docker run --rm --network host "${COMMON_ENV[@]}" "$IMG" maintenance list

          echo "=== SIGTERM: web/worker/trust/scheduler must exit 0 ==="
          for c in smoke-web smoke-worker smoke-trust smoke-sched; do
            docker stop -t 15 "$c"
            CODE=$(docker inspect "$c" --format '{{.State.ExitCode}}')
            if [ "$CODE" != "0" ]; then
              echo "::error::$c exited $CODE on SIGTERM, expected 0"
              dump_role_diagnostics "$c"
              exit 1
            fi
          done
          echo "All four long-running roles exited 0 on SIGTERM."

          echo "=== filesystem checks: no Terraform artifacts, no libaom/libavif, no perl/apt/dpkg, libssh2 present ==="
          # Every check below greps a FILE, never a live producer process
          # piped straight into grep. `grep -q` (and, for the perl check,
          # the second `grep -v` stage) can legitimately exit as soon as
          # it decides its own result, closing its read end early; if the
          # thing on the other end of a pipe is still writing (as `echo
          # "$EXPORT_LIST" | grep -q ...` was, for a 20000+ line listing),
          # that producer is killed by SIGPIPE (exit 141) before it
          # finishes, and `pipefail` reports the PIPELINE's status as 141
          # even though grep itself matched (or didn't) correctly. That
          # false failure is exactly what broke this step: libssh2 WAS
          # present, `grep -qi "libssh2"` genuinely matched (exit 0), but
          # `echo` got SIGPIPE writing the remaining ~20000 lines nobody
          # was going to read, and pipefail surfaced that 141 as the
          # pipeline's result instead of grep's real 0. Reading from a
          # file sidesteps this class of bug entirely: grep is the only
          # process touching stdin, so there is no upstream producer left
          # for a signal to kill.
          CID=$(docker create "$IMG")
          EXPORT_LIST_FILE="$(mktemp)"
          docker export "$CID" | tar -tv > "$EXPORT_LIST_FILE"
          docker rm "$CID" >/dev/null

          if grep -qiE "terraform-provider-|\.tfstate$|\.tfplan$|\.terraform/|infrastructure/" "$EXPORT_LIST_FILE"; then
            echo "::error::Terraform/infrastructure artifacts found in image"
            exit 1
          fi
          echo "OK: no Terraform artifacts"

          if grep -qiE "libaom|libavif" "$EXPORT_LIST_FILE"; then
            echo "::error::libaom/libavif found in image"
            exit 1
          fi
          echo "OK: no libaom/libavif"

          if grep -iE "perl" "$EXPORT_LIST_FILE" | grep -v "vendor/scrivo/highlight.php" >/dev/null; then
            echo "::error::an unexpected perl-related file was found in the image"
            exit 1
          fi
          echo "OK: no perl interpreter (only the harmless syntax-highlight data file, if present)"

          if grep -qiE "/usr/bin/apt|/usr/bin/dpkg|/var/lib/dpkg" "$EXPORT_LIST_FILE"; then
            echo "::error::apt or dpkg found in image"
            exit 1
          fi
          echo "OK: no apt/dpkg"

          if ! grep -Fqi 'libssh2' "$EXPORT_LIST_FILE"; then
            echo "::error::libssh2 runtime library not found in exported image filesystem"
            exit 1
          fi
          echo "OK: libssh2 library file present in exported image filesystem"

          rm -f "$EXPORT_LIST_FILE"

          # Filesystem presence alone doesn't prove the application actually
          # links/uses libssh2 at runtime — confirm the runtime curl
          # extension (the only thing in this image that uses libssh2, for
          # scp://sftp:// support) reports it via curl_version()
          # ['libssh_version'] (verified field name/value against this
          # exact build: "libssh2/1.11.1"). Invokes php directly
          # (--entrypoint) rather than a shell, since distroless has none.
          echo "=== runtime probe: curl reports libssh2 ==="
          docker run --rm --entrypoint /usr/local/bin/php "$IMG" -r '
              if (! function_exists("curl_version")) {
                  fwrite(STDERR, "curl_version() is unavailable".PHP_EOL);
                  exit(1);
              }

              $version = curl_version();
              $ssh = $version["libssh_version"] ?? "";

              if ($ssh === "" || stripos($ssh, "libssh2") === false) {
                  fwrite(
                      STDERR,
                      "libssh2 is not reported by the runtime curl library".PHP_EOL
                  );
                  exit(1);
              }

              fwrite(STDOUT, "OK: runtime reports ".$ssh.PHP_EOL);
          '

          echo "=== GD: JPEG/PNG/WebP yes, AVIF function absent ==="
          docker run --rm --network host "${COMMON_ENV[@]}" "$IMG" maintenance tinker --execute="
            \$i = gd_info();
            if (!\$i['JPEG Support'] || !\$i['PNG Support'] || !\$i['WebP Support']) { fwrite(STDERR, 'GD missing required format support'.PHP_EOL); exit(1); }
            if (function_exists('imagecreatefromavif')) { fwrite(STDERR, 'AVIF support must not be compiled in'.PHP_EOL); exit(1); }
            echo 'GD OK: jpeg/png/webp present, avif absent'.PHP_EOL;
          "

          echo "All smoke tests passed."

      - name: Clean up smoke-test containers
        if: always()
        run: docker rm -f smoke-web smoke-worker smoke-trust smoke-sched 2>/dev/null || true

      - name: Push to ECR (only after every gate above has passed)
        id: push
        run: |
          set -euo pipefail
          IMAGE="${{ vars.ECR_REPOSITORY_URL }}:${{ needs.validate-commit.outputs.short_sha }}"
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | cut -d'@' -f2)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ vars.ECR_REPOSITORY_URL }}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Verify the pushed digest via the ECR API (not just Docker's local output)
        run: |
          set -euo pipefail
          REPO_NAME="$(basename "${{ vars.ECR_REPOSITORY_URL }}")"
          TAG="${{ needs.validate-commit.outputs.short_sha }}"
          REMOTE_DIGEST="$(aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)"
          LOCAL_DIGEST="${{ steps.push.outputs.digest }}"
          if [ "$REMOTE_DIGEST" != "$LOCAL_DIGEST" ]; then
            echo "::error::ECR-reported digest ($REMOTE_DIGEST) does not match the digest Docker reported locally ($LOCAL_DIGEST)"
            exit 1
          fi
          echo "Confirmed via ECR API: digest $REMOTE_DIGEST matches for tag $TAG"

      - name: Report ECR scan-on-push status (best-effort — does not gate this job)
        run: |
          set +e
          REPO_NAME="$(basename "${{ vars.ECR_REPOSITORY_URL }}")"
          TAG="${{ needs.validate-commit.outputs.short_sha }}"
          for i in $(seq 1 12); do
            STATUS=$(aws ecr describe-image-scan-findings --repository-name "$REPO_NAME" --image-id imageTag="$TAG" --query 'imageScanStatus.status' --output text 2>/dev/null)
            [ "$STATUS" = "COMPLETE" ] && break
            sleep 15
          done
          echo "Final ECR scan status: ${STATUS:-UNKNOWN}"
          aws ecr describe-image-scan-findings --repository-name "$REPO_NAME" --image-id imageTag="$TAG" --query 'imageScanFindings.findingSeverityCounts' --output json 2>/dev/null || echo "Scan findings not yet available."

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.push.outputs.image_ref }}

  # ---------------------------------------------------------------------
  release-evidence:
    name: Produce release evidence
    needs: [validate-commit, build-scan-and-publish]
    if: always() && needs.build-scan-and-publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assemble evidence
        run: |
          cat <<EOF > release-evidence.json
          {
            "git_commit": "${{ inputs.commit_sha }}",
            "short_sha": "${{ needs.validate-commit.outputs.short_sha }}",
            "image_digest": "${{ needs.build-scan-and-publish.outputs.image_digest }}",
            "image_ref": "${{ needs.build-scan-and-publish.outputs.image_ref }}",
            "build_id": "${{ github.run_id }}",
            "build_and_publish_job_result": "${{ needs.build-scan-and-publish.result }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat release-evidence.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: release-evidence.json

  # ---------------------------------------------------------------------
  # INTENTIONALLY UNREACHABLE. Deployment is a separate, not-yet-built,
  # approval-gated phase. This stub exists only to document the intended
  # future shape (separate IAM identity, separate GitHub Environment).
  # Gated on a repository variable that does not exist yet
  # (ENABLE_STAGING_DEPLOY is deliberately absent from the required-variable
  # list in this workflow's header comment) — an unset vars.* reference
  # evaluates to an empty string, so this condition is always false today,
  # with no bare constant for actionlint to flag. The job stays unreachable
  # until a real deployment approval phase deliberately sets that variable
  # to "true" as part of implementing this job for real.
  # ---------------------------------------------------------------------
  deploy-staging:
    name: "[DISABLED] Deploy to staging — not yet implemented"
    needs: build-scan-and-publish
    if: vars.ENABLE_STAGING_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials (deploy role — never the ECR publish role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Not implemented
        run: |
          echo "Deployment is intentionally not implemented in this workflow."
          echo "See docs/ecs/database-migrations.md and docs/ecs/staging-readiness-report.md"
          echo "for what a real deploy-staging job requires before this stub can be built out."
          exit 1
