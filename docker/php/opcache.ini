; Opcache — enabled for every role (web AND cli/worker/scheduler/migrate/
; maintenance), since composer's optimized autoloader plus opcache benefits
; any long-running or repeatedly-invoked PHP process, not just HTTP requests.
; See docs/ecs/container-architecture.md.

opcache.enable = 1
opcache.enable_cli = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; The image filesystem is immutable at runtime (application code is not
; mutated after build — no `composer update`/`npm run build` ever runs
; inside a live container), so opcache never needs to notice a source change
; mid-run. validate_timestamps=0 trades "edit a file and see it instantly"
; (irrelevant in an immutable container) for avoiding a stat() call per
; included file on every request.
opcache.validate_timestamps = 0

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.enable_file_override = 0
