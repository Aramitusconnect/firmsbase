; Production PHP settings for the FirmsBase container image.
; See docs/ecs/container-architecture.md. Values are conservative defaults;
; per-role CPU/memory (and therefore effective headroom) is set at the ECS
; task-definition level, documented in docs/ecs/infrastructure-architecture.md.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Laravel's own exception handler renders responses; PHP-level error display
; must stay off in every environment this image runs in (staging included)
; to avoid leaking stack traces per the mission's health/observability
; requirements (docs/ecs/observability.md).

memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 32M

; Sessions are handled by Laravel's own session driver (database/redis per
; env), not PHP's native session handler — session.save_handler is left at
; its default and unused in practice, since config/session.php's driver
; takes over session persistence.

date.timezone = UTC

; realpath cache tuned up slightly from the PHP default since the app has a
; large autoload map (see docs/ecs/ec2-dependency-audit.md — hundreds of
; app/Services classes); avoids repeated filesystem stats for a read-only
; image filesystem.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
